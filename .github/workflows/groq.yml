name: Groq Briefing

on:
  workflow_dispatch:

  schedule:
    - cron: "0 22,10 * * *"

jobs:

  run:

    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DISCORD_WEBHOOK_GROQ: ${{ secrets.DISCORD_WEBHOOK_GROQ }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Groq
        run: |
          python groq_briefing.py
